# Transformer Music Generator Configuration
model:
  name: transformer
  vocab_size: 128
  embedding_dim: 64
  num_heads: 4
  num_layers: 3
  dropout: 0.1
  max_seq_len: 512

data:
  dataset: maestro
  sequence_length: 200
  batch_size: 32
  train_split: 0.85
  val_split: 0.10
  test_split: 0.05

training:
  epochs: 100
  learning_rate: 0.0005
  weight_decay: 1e-5
  grad_clip: 3.0
  checkpoint_interval: 10
  device: cpu

generation:
  temperature: 1.2
  top_k: 40
  max_notes: 500
